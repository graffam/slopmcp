<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;padding:16px;line-height:1.5}
h2{font-size:16px;font-weight:600;margin-bottom:4px;color:#f0f6fc}
.subtitle{font-size:13px;color:#8b949e;margin-bottom:16px}
.timeline{display:flex;flex-direction:column;gap:12px}
.admission{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;position:relative}
.admission:hover{border-color:#58a6ff}
.adm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hadm-id{font-size:14px;font-weight:600;color:#58a6ff}
.adm-type{font-size:11px;padding:2px 8px;border-radius:10px;background:#1f3a5f;color:#79c0ff}
.adm-details{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px}
.adm-label{color:#8b949e}
.adm-value{color:#e6edf3;font-variant-numeric:tabular-nums}
.mortality{color:#f85149;font-weight:600;font-size:11px;margin-top:8px}
#loading{text-align:center;padding:40px;color:#8b949e}
</style>
</head>
<body>
<h2>Hospital Admissions</h2>
<p class="subtitle" id="summary"></p>
<div id="loading">Waiting for results...</div>
<div class="timeline" id="timeline"></div>
<script>
function unwrap(o){if(!o)return null;return o.structuredContent||o}

var _init=unwrap(window.openai&&window.openai.toolOutput);
if(_init)render(_init);

window.addEventListener("openai:set_globals",function(e){
  var o=unwrap(e.detail&&e.detail.globals&&e.detail.globals.toolOutput);
  if(o)render(o);
},{passive:true});

window.addEventListener("message",function(e){
  var m=e.data;

  if(!m||m.jsonrpc!=="2.0")return;
  var params=m.params||{};
  var sc=params.structuredContent||params.result&&params.result.structuredContent;
  if(sc)render(sc);
},{passive:true});

function render(data){
  var rows=data.admissions||[];
  document.getElementById("loading").style.display="none";
  document.getElementById("summary").textContent="Found "+data.count+" admission(s) for patient "+data.subject_id;
  var tl=document.getElementById("timeline");
  tl.innerHTML="";
  rows.forEach(function(a){
    var div=document.createElement("div");
    div.className="admission";
    var mort=a.hospital_expire_flag?'<div class="mortality">In-hospital mortality</div>':"";
    div.innerHTML=
      '<div class="adm-header">'+
        '<span class="hadm-id">HADM '+a.hadm_id+'</span>'+
        '<span class="adm-type">'+nvl(a.admission_type)+'</span>'+
      '</div>'+
      '<div class="adm-details">'+
        '<span class="adm-label">Admitted</span><span class="adm-value">'+nvl(a.admittime)+'</span>'+
        '<span class="adm-label">Discharged</span><span class="adm-value">'+nvl(a.dischtime)+'</span>'+
        '<span class="adm-label">Location</span><span class="adm-value">'+nvl(a.admission_location)+'</span>'+
        '<span class="adm-label">Discharge To</span><span class="adm-value">'+nvl(a.discharge_location)+'</span>'+
        '<span class="adm-label">Insurance</span><span class="adm-value">'+nvl(a.insurance)+'</span>'+
        '<span class="adm-label">Race</span><span class="adm-value">'+nvl(a.race)+'</span>'+
      '</div>'+mort;
    tl.appendChild(div);
  });
}
function nvl(v){return v==null?"—":String(v)}
</script>
</body>
</html>
