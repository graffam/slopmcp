<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;padding:16px;line-height:1.5}
h2{font-size:16px;font-weight:600;margin-bottom:4px;color:#f0f6fc}
.subtitle{font-size:13px;color:#8b949e;margin-bottom:16px}

.overall{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;display:flex;align-items:center;gap:20px;margin-bottom:20px}
.ring-container{position:relative;width:80px;height:80px;flex-shrink:0}
.ring-container svg{width:80px;height:80px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#21262d;stroke-width:6}
.ring-fg{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.overall-text h3{font-size:18px;font-weight:600;margin-bottom:4px}
.overall-text .status-tag{font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;display:inline-block}

.insights{margin-bottom:20px}
.insights h3{font-size:13px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.insight-item{font-size:13px;color:#e6edf3;padding:6px 0;border-bottom:1px solid #21262d}
.insight-item:last-child{border-bottom:none}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:20px}
.score-card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px;transition:border-color .15s}
.score-card:hover{border-color:#58a6ff}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-title{font-size:13px;font-weight:600;color:#e6edf3}
.card-score{display:flex;align-items:center;gap:6px}
.mini-ring{width:36px;height:36px;position:relative}
.mini-ring svg{width:36px;height:36px;transform:rotate(-90deg)}
.mini-ring-bg{fill:none;stroke:#21262d;stroke-width:4}
.mini-ring-fg{fill:none;stroke-width:4;stroke-linecap:round}
.mini-ring-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;font-weight:700}
.card-value{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:#e6edf3;margin-bottom:2px}
.card-unit{font-size:11px;color:#8b949e;font-weight:400}
.card-insight{font-size:12px;color:#8b949e;margin-top:6px}
.card-meta{font-size:11px;color:#484f58;margin-top:4px}
.trend-badge{font-size:11px;padding:1px 6px;border-radius:6px;background:#21262d;color:#8b949e;display:inline-block}

.status-good{color:#3fb950}.bg-good{background:#0d2818;border-color:#238636}
.status-needs-attention{color:#d29922}.bg-needs-attention{background:#2d2000;border-color:#9e6a03}
.status-high-risk{color:#f85149}.bg-high-risk{background:#3d1214;border-color:#da3633}
.status-unknown{color:#8b949e}

.section{margin-bottom:20px}
.section h3{font-size:13px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;background:#161b22;color:#8b949e;font-weight:500;border-bottom:1px solid #30363d}
td{padding:7px 10px;border-bottom:1px solid #21262d;font-variant-numeric:tabular-nums}
tr:hover td{background:#161b22}
.flag-abnormal{color:#f85149;font-weight:600}
.time-cell{color:#8b949e;font-size:12px}
#loading{text-align:center;padding:40px;color:#8b949e}
</style>
</head>
<body>
<h2 id="title">Health Readout</h2>
<p class="subtitle" id="summary"></p>
<div id="loading">Waiting for results...</div>
<div id="content" style="display:none">
  <div class="overall" id="overall"></div>
  <div class="insights" id="insights-section" style="display:none">
    <h3>Priority Concerns</h3>
    <div id="insights"></div>
  </div>
  <div class="cards-grid" id="cards"></div>
  <div class="section" id="labs-section" style="display:none">
    <h3>Latest Labs</h3>
    <table><thead><tr><th>Metric</th><th>Value</th><th>Flag</th><th>Time</th></tr></thead>
    <tbody id="labs-tbody"></tbody></table>
  </div>
  <div class="section" id="vitals-section" style="display:none">
    <h3>Latest Vitals</h3>
    <table><thead><tr><th>Metric</th><th>Value</th><th>Time</th></tr></thead>
    <tbody id="vitals-tbody"></tbody></table>
  </div>
</div>
<script>
function unwrap(o){if(!o)return null;return o.structuredContent||o}
function extractData(payload){
  if(!payload)return null;
  if(typeof payload==="string"){
    try{return extractData(JSON.parse(payload));}catch(_){return null;}
  }
  if(typeof payload!=="object")return null;
  if(payload.structuredContent)return payload.structuredContent;
  if(payload.toolOutput)return extractData(payload.toolOutput);
  if(payload.toolResponseMetadata)return extractData(payload.toolResponseMetadata);
  if(payload.result)return extractData(payload.result);
  if(payload.params)return extractData(payload.params);
  if(payload.globals&&payload.globals.toolOutput)return extractData(payload.globals.toolOutput);
  if(payload.jsonrpc||payload.method)return null;
  return payload;
}
function maybeRender(payload){
  var data=extractData(payload);
  if(!data)return false;
  render(data);
  return true;
}
function hydrateFromHost(){
  if(maybeRender(window.openai&&window.openai.toolOutput))return;
  if(maybeRender(window.openai&&window.openai.toolResponseMetadata))return;
  if(maybeRender(window.openai&&window.openai.globals&&window.openai.globals.toolOutput))return;
  var attempts=0;
  var timer=setInterval(function(){
    attempts+=1;
    if(maybeRender(window.openai&&window.openai.toolOutput))return clearInterval(timer);
    if(maybeRender(window.openai&&window.openai.toolResponseMetadata))return clearInterval(timer);
    if(maybeRender(window.openai&&window.openai.globals&&window.openai.globals.toolOutput))return clearInterval(timer);
    if(attempts>=80)clearInterval(timer);
  },100);
}

hydrateFromHost();

window.addEventListener("openai:set_globals",function(e){
  maybeRender(e&&e.detail);
},{passive:true});

window.addEventListener("openai:setGlobals",function(e){
  maybeRender(e&&e.detail);
},{passive:true});

window.addEventListener("message",function(e){
  var m=e.data;
  if(!m)return;
  if(m.jsonrpc&&m.jsonrpc!=="2.0")return;
  maybeRender(m);
},{passive:true});

function statusColor(s){
  if(s==="good")return"#3fb950";
  if(s==="needs-attention")return"#d29922";
  if(s==="high-risk")return"#f85149";
  return"#8b949e";
}

function ringSVG(score,radius,stroke,cls){
  var C=2*Math.PI*radius;
  var offset=C*(1-score/100);
  var color=statusColor(score>=85?"good":score>=65?"needs-attention":"high-risk");
  return'<svg viewBox="0 0 '+(radius*2+stroke)+' '+(radius*2+stroke)+'">'+
    '<circle cx="'+(radius+stroke/2)+'" cy="'+(radius+stroke/2)+'" r="'+radius+'" class="'+cls+'-bg"/>'+
    '<circle cx="'+(radius+stroke/2)+'" cy="'+(radius+stroke/2)+'" r="'+radius+'" class="'+cls+'-fg" '+
    'stroke="'+color+'" stroke-dasharray="'+C+'" stroke-dashoffset="'+offset+'"/>'+
    '</svg>';
}

function render(data){
  var readout=data.readout||{};
  var cards=readout.cards||[];
  document.getElementById("loading").style.display="none";
  document.getElementById("content").style.display="";
  document.getElementById("title").textContent="Health Readout: Patient "+data.subject_id;
  document.getElementById("summary").textContent=data.summary_text||"";

  // Overall ring
  var os=readout.overall_score||0;
  var ost=readout.overall_status||"unknown";
  var overallDiv=document.getElementById("overall");
  overallDiv.innerHTML=
    '<div class="ring-container">'+ringSVG(os,34,6,"ring")+
    '<span class="ring-label">'+os+'</span></div>'+
    '<div class="overall-text"><h3>Overall Health Score</h3>'+
    '<span class="overall-text status-tag bg-'+ost+'"><span class="status-'+ost+'">'+ost.replace("-"," ")+'</span></span></div>';

  // Insights
  var insights=readout.insights||[];
  if(insights.length){
    document.getElementById("insights-section").style.display="";
    var iDiv=document.getElementById("insights");
    iDiv.innerHTML="";
    insights.forEach(function(text){
      var d=document.createElement("div");
      d.className="insight-item";
      d.textContent=text;
      iDiv.appendChild(d);
    });
  }

  // Score cards
  var cardsDiv=document.getElementById("cards");
  cardsDiv.innerHTML="";
  cards.forEach(function(c){
    var card=document.createElement("div");
    card.className="score-card";
    var trendHtml=c.trend_detail?'<span class="trend-badge">'+c.trend_detail+'</span>':"";
    card.innerHTML=
      '<div class="card-top">'+
        '<span class="card-title">'+c.title+'</span>'+
        '<div class="mini-ring">'+ringSVG(c.score,14,4,"mini-ring")+
        '<span class="mini-ring-label">'+c.score+'</span></div>'+
      '</div>'+
      '<div class="card-value">'+nvl(c.value)+'<span class="card-unit"> '+nvl(c.unit)+'</span></div>'+
      trendHtml+
      '<div class="card-insight status-'+c.status+'">'+nvl(c.insight)+'</div>'+
      '<div class="card-meta">'+nvl(c.source)+(c.recorded_at?" \u00B7 "+c.recorded_at:"")+'</div>';
    cardsDiv.appendChild(card);
  });

  // Labs table
  var labs=data.latest_labs||[];
  if(labs.length){
    document.getElementById("labs-section").style.display="";
    var ltb=document.getElementById("labs-tbody");
    ltb.innerHTML="";
    labs.forEach(function(r){
      var tr=document.createElement("tr");
      var flag=r.flag||"normal";
      var fc=flag.toLowerCase()==="normal"?"":"flag-abnormal";
      tr.innerHTML=
        '<td>'+nvl(r.display_name)+'</td>'+
        '<td>'+nvl(r.value)+" "+(r.unit||"")+'</td>'+
        '<td class="'+fc+'">'+flag+'</td>'+
        '<td class="time-cell">'+nvl(r.charttime)+'</td>';
      ltb.appendChild(tr);
    });
  }

  // Vitals table
  var vitals=data.latest_vitals||[];
  if(vitals.length){
    document.getElementById("vitals-section").style.display="";
    var vtb=document.getElementById("vitals-tbody");
    vtb.innerHTML="";
    vitals.forEach(function(r){
      var tr=document.createElement("tr");
      tr.innerHTML=
        '<td>'+nvl(r.display_name)+'</td>'+
        '<td>'+nvl(r.value)+" "+(r.unit||"")+'</td>'+
        '<td class="time-cell">'+nvl(r.charttime)+'</td>';
      vtb.appendChild(tr);
    });
  }
}
function nvl(v){return v==null?"—":String(v)}
</script>
</body>
</html>
