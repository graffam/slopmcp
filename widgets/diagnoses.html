<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;padding:16px;line-height:1.5}
h2{font-size:16px;font-weight:600;margin-bottom:4px;color:#f0f6fc}
.subtitle{font-size:13px;color:#8b949e;margin-bottom:16px}
.dx-list{display:flex;flex-direction:column;gap:8px}
.dx-item{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 14px;display:flex;align-items:flex-start;gap:12px}
.dx-item:hover{border-color:#58a6ff}
.dx-seq{min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#1f3a5f;color:#58a6ff;font-size:12px;font-weight:600;flex-shrink:0}
.dx-body{flex:1}
.dx-title{font-size:13px;color:#e6edf3;margin-bottom:4px}
.dx-meta{display:flex;gap:12px;font-size:11px;color:#8b949e}
.icd-badge{font-family:'SF Mono',SFMono-Regular,Consolas,monospace;background:#21262d;padding:1px 6px;border-radius:4px;font-size:11px}
#loading{text-align:center;padding:40px;color:#8b949e}
</style>
</head>
<body>
<h2>Diagnoses</h2>
<p class="subtitle" id="summary"></p>
<div id="loading">Waiting for results...</div>
<div class="dx-list" id="list"></div>
<script>
function unwrap(o){if(!o)return null;return o.structuredContent||o}
function extractData(payload){
  if(!payload)return null;
  if(typeof payload==="string"){
    try{return extractData(JSON.parse(payload));}catch(_){return null;}
  }
  if(typeof payload!=="object")return null;
  if(payload.structuredContent)return payload.structuredContent;
  if(payload._meta)return extractData(payload._meta);
  if(payload.toolOutput)return extractData(payload.toolOutput);
  if(payload.toolResponseMetadata)return extractData(payload.toolResponseMetadata);
  if(payload.result)return extractData(payload.result);
  if(payload.params)return extractData(payload.params);
  if(payload.arguments)return extractData(payload.arguments);
  if(payload.globals&&payload.globals.toolOutput)return extractData(payload.globals.toolOutput);
  if(payload.jsonrpc||payload.method)return null;
  return payload;
}
function maybeRender(payload){
  var data=extractData(payload);
  if(!data)return false;
  render(data);
  return true;
}
function hydrateFromHost(){
  if(maybeRender(window.openai&&window.openai.toolOutput))return;
  if(maybeRender(window.openai&&window.openai.toolResponseMetadata))return;
  if(maybeRender(window.openai&&window.openai.globals&&window.openai.globals.toolOutput))return;
  var attempts=0;
  var timer=setInterval(function(){
    attempts+=1;
    if(maybeRender(window.openai&&window.openai.toolOutput))return clearInterval(timer);
    if(maybeRender(window.openai&&window.openai.toolResponseMetadata))return clearInterval(timer);
    if(maybeRender(window.openai&&window.openai.globals&&window.openai.globals.toolOutput))return clearInterval(timer);
    if(attempts>=80)clearInterval(timer);
  },100);
}

hydrateFromHost();
initializeHostBridge();

window.addEventListener("openai:set_globals",function(e){
  maybeRender(e&&e.detail);
},{passive:true});

window.addEventListener("openai:setGlobals",function(e){
  maybeRender(e&&e.detail);
},{passive:true});

var initRequestId=null;
function initializeHostBridge(){
  initRequestId=Date.now();
  window.parent.postMessage({
    jsonrpc:"2.0",
    id:initRequestId,
    method:"ui/initialize",
    params:{
      appInfo:{name:"mimic-widget",version:"1.0.0"},
      appCapabilities:{},
      protocolVersion:"2026-01-26"
    }
  },"*");
}

window.addEventListener("message",function(e){
  var m=e.data;
  if(typeof m==="string"){
    try{m=JSON.parse(m);}catch(_){return;}
  }
  if(!m)return;
  if(m.id===initRequestId&&m.result){
    window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized"},"*");
  }
  if(m.jsonrpc&&m.jsonrpc!=="2.0")return;
  maybeRender(m);
},{passive:true});

function render(data){
  var rows=data.diagnoses||[];
  document.getElementById("loading").style.display="none";
  document.getElementById("summary").textContent="Found "+data.count+" diagnosis code(s) for admission "+data.hadm_id;
  var list=document.getElementById("list");
  list.innerHTML="";
  rows.forEach(function(d){
    var item=document.createElement("div");
    item.className="dx-item";
    item.innerHTML=
      '<div class="dx-seq">'+d.seq_num+'</div>'+
      '<div class="dx-body">'+
        '<div class="dx-title">'+esc(d.diagnosis_title||d.icd_code)+'</div>'+
        '<div class="dx-meta">'+
          '<span class="icd-badge">ICD-'+d.icd_version+': '+d.icd_code+'</span>'+
        '</div>'+
      '</div>';
    list.appendChild(item);
  });
}
function esc(s){if(!s)return"—";var d=document.createElement("span");d.textContent=s;return d.innerHTML}
</script>
</body>
</html>
